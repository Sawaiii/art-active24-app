# XcodeGen-описание iOS-приложения «Арт-Актив».
# Генерация:  cd ios && xcodegen generate   →  ArtActive.xcodeproj (в git не хранится)
name: ArtActive
options:
  bundleIdPrefix: ru.artactive24
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"                 # языковой режим 5; код пишется Swift 6-ready
    SWIFT_STRICT_CONCURRENCY: targeted
    DEVELOPMENT_TEAM: ""                 # <- Team ID для подписанной сборки (см. README)
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  ArtActive:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    # API_BASE_URL → Info.plist (APIBaseURL). Боевой адрес — только из секрета CI (Config/Secrets.xcconfig).
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: ArtActive
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_NAME: ArtActive
        PRODUCT_BUNDLE_IDENTIFIER: ru.artactive24.app
        INFOPLIST_FILE: ArtActive/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Push + Universal Links. В CI без подписи переопределяется пустым значением.
        CODE_SIGN_ENTITLEMENTS: ArtActive/Resources/ArtActive.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"      # только iPhone
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_ASSET_PATHS: "\"ArtActive/PreviewContent\""

  ArtActiveTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ArtActiveTests
      # Эталонные векторы цены берём прямо из contract/ — без ручного копирования.
      - path: ../contract/pricing-vectors.json
        buildPhase: resources
      # Фикстуры превью проверяются на соответствие DTO.
      - path: ArtActive/PreviewContent/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: ArtActive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.artactive24.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ArtActive.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ArtActive"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # UI-тесты = сценарий скриншотов для визуальной проверки (workflow ios-screenshots.yml).
  # Отдельная схема ArtActiveScreenshots: основная схема ArtActive и ios.yml их не собирают.
  ArtActiveUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ArtActiveUITests
    dependencies:
      - target: ArtActive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.artactive24.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ArtActive

schemes:
  ArtActive:
    build:
      targets:
        ArtActive: all
        ArtActiveTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - ArtActive
      targets:
        - name: ArtActiveTests
          randomExecutionOrder: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  ArtActiveScreenshots:
    build:
      targets:
        ArtActive: all
        ArtActiveUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: ArtActiveUITests
